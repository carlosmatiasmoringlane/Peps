# Render blueprint. Create from the dashboard: New > Blueprint.
services:
  - type: web
    name: peptra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # a disk requires a paid instance type
    healthCheckPath: /healthz
    numInstances: 1        # the flat-file store is single-writer
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: WAITLIST_FILE
        value: /data/waitlist.jsonl
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MAIL_PROVIDER
        value: postmark
      - key: MAIL_FROM
        value: Peptra <hello@peptra.com.co>
      - key: PUBLIC_URL
        sync: false          # set to your real domain in the dashboard
      - key: POSTMARK_TOKEN
        sync: false          # set in the dashboard, never in this file
    disk:
      name: peptra-data
      mountPath: /data
      sizeGB: 1
