# Fly.io. Deploy with:  fly launch --copy-config --now
app = "peptra"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY = "1"
  WAITLIST_FILE = "/data/waitlist.jsonl"
  MAIL_PROVIDER = "postmark"
  MAIL_FROM = "Peptra <hello@peptra.com.co>"
  # PUBLIC_URL must match the domain you serve from, or confirmation links
  # point at the wrong host. Set it once the certificate is live:
  #   fly secrets set PUBLIC_URL=https://peptra.com.co
  # POSTMARK_TOKEN goes in secrets too, never here.

# Signups live on this volume. Without it a redeploy wipes the list.
[[mounts]]
  source = "peptra_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # A volume binds a machine to one host, so keep a single machine until
  # the store moves to Postgres. See README, "When to replace the flat file".
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"
