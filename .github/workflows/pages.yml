# Publishes public/ to GitHub Pages on every push to main.
# Enable once under Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Don't publish a page whose own checks fail.
      - run: npm test

      # Surfaces LAUNCH-CHECKLIST.md in the run summary on every deploy, so
      # the open questions are in front of whoever ships rather than buried
      # in a chat log. Never fails the build — these are decisions, not bugs.
      - name: Launch checklist
        run: |
          {
            echo "## ⚠️ Recheck before this is public"
            echo
            echo "This deploy publishes the live catalogue. Open items:"
            echo
            sed -n '/^## 1\./,$p' LAUNCH-CHECKLIST.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
