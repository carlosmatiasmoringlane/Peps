name: CI

on:
  # Pushes to a branch with an open PR are covered by the pull_request
  # trigger; running both doubles every CI run for no extra signal.
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
